// =====================================================================================
//  Science result text for Bennu
// =====================================================================================
//
//  KSP builds result keys as <BodyName><Situation>, e.g. BennuSrfLanded. Without
//  entries here every experiment falls back to the generic "default" string, which is
//  a shame on a body with this much character. Situations available on an airless
//  world: SrfLanded, InSpaceLow, InSpaceHigh.
//
//  These are additive patches - they add keys to the stock experiments rather than
//  replacing anything, so they are safe alongside other planet packs.
// =====================================================================================

@EXPERIMENT_DEFINITION[*]:HAS[#id[crewReport]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = Calling this "landed" feels generous. The craft is resting on Bennu in roughly the way a leaf rests on a pond.
        BennuInSpaceLow = From this close Bennu fills the window, and it is still hard to see. Four percent of the light that hits it comes back.
        BennuInSpaceHigh = Bennu is out there somewhere. The navball insists on it. The window offers no supporting evidence.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[evaReport]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = Every footfall throws up a slow fountain of gravel that takes a full minute to settle. Nobody is running any experiments until it does.
        BennuInSpaceLow = Standing on the ladder, it is genuinely unclear whether the Kerbal is orbiting Bennu or standing on it. Bennu seems similarly unsure.
        BennuInSpaceHigh = A dark, silent, diamond-shaped nothing, turning once every four and a bit hours, exactly as it has for a very long time.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[surfaceSample]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = The sample scoop went in far further than expected and came out heaped. There is no bedrock here to speak of - Bennu is gravel most of the way down.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[mysteryGoo]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = The goo has taken on a distinctly sooty tinge. Bennu's carbon is getting everywhere, as carbon does.
        BennuInSpaceLow = The goo drifts to the side of the container facing Bennu. Whether this counts as gravity is a matter for the theorists.
        BennuInSpaceHigh = The goo is unmoved, both literally and figuratively.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[temperatureScan]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = Surface temperature swings wildly between the sunlit and shadowed sides. With no atmosphere and almost no thermal inertia, the rubble simply forgets it was ever warm.
        BennuInSpaceLow = Bennu radiates its accumulated heat away as fast as it collects it.
        BennuInSpaceHigh = Ambient temperature readings out here are dominated entirely by the Sun.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[barometerScan]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = Zero. Emphatically, unambiguously zero.
        BennuInSpaceLow = Still zero, now measured from a slightly more expensive vantage point.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[seismicScan]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = The impact readings propagate strangely - they scatter and die within metres. There is no solid body here to ring like a bell, just a loosely stacked heap of rock.
    }
}

@EXPERIMENT_DEFINITION[*]:HAS[#id[gravityScan]]:FOR[Bennu]
{
    @RESULTS
    {
        BennuSrfLanded = The gravimeter reports a value so small it initially registered as an instrument fault. It is not a fault.
        BennuInSpaceLow = Bennu's gravity field is lumpy and slightly off-centre, betraying an interior that is anything but uniform.
        BennuInSpaceHigh = At this range Bennu's pull is a rounding error on the Sun's.
    }
}
