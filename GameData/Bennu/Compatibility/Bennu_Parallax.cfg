// =====================================================================================
//  Parallax Continued compatibility for Bennu
// =====================================================================================
//
//  Three separate things happen in this file:
//
//    1. ParallaxTerrain / Body        - the close-up tessellated terrain shader
//    2. ParallaxScaledProperties      - how the body looks from orbit and map view
//    3. @Kopernicus patches           - the scaled mesh swap and the near-field
//                                       subdivision mod Parallax needs on every body
//
//  TEXTURE REUSE
//  -------------
//  Bennu points at Gilly's Parallax detail textures rather than shipping its own.
//  Gilly is the closest match already installed - a dark, airless, grey rocky body
//  with the same single-texture-set layout (mid only, no low/high/steep variants) -
//  and referencing a path costs nothing and redistributes nothing. Bennu's much
//  darker carbonaceous colour comes from the VertexColorMap in Bennu.cfg, which
//  Parallax blends over these detail textures.
//
//  Everything here is gated on Parallax_StockTerrainTextures being present. Without
//  it, Bennu falls back to the stock Gilly-derived PQS material from the template and
//  still works, just without tessellation.
// =====================================================================================


// -------------------------------------------------------------------------------------
//  1 + 2. Terrain shader and scaled-space appearance
// -------------------------------------------------------------------------------------
ParallaxTerrain:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
    Body
    {
        name = Bennu
        emissive = False

        ShaderProperties
        {
            // Single detail set used for every slope band - as Gilly does.
            _MainTexLow = Parallax_StockTerrainTextures/Gilly/PluginData/mid00.dds
            _MainTexMid = Parallax_StockTerrainTextures/Gilly/PluginData/mid00.dds
            _MainTexHigh = Parallax_StockTerrainTextures/Gilly/PluginData/mid00.dds
            _MainTexSteep = Parallax_StockTerrainTextures/Gilly/PluginData/mid00.dds
            _BumpMapLow = Parallax_StockTerrainTextures/Gilly/PluginData/mid01.dds
            _BumpMapMid = Parallax_StockTerrainTextures/Gilly/PluginData/mid01.dds
            _BumpMapHigh = Parallax_StockTerrainTextures/Gilly/PluginData/mid01.dds
            _BumpMapSteep = Parallax_StockTerrainTextures/Gilly/PluginData/mid01.dds
            _InfluenceMap = Parallax_StockTerrainTextures/Gilly/PluginData/influence.dds
            _DisplacementMap = Parallax_StockTerrainTextures/Gilly/PluginData/displacement.dds
            _OcclusionMap = Parallax_StockTerrainTextures/Gilly/PluginData/occlusion.dds

            // Tessellation displacement. Halved after flight testing - on a body 2 km
            // across this adds to an already-rough surface and reads as noise rather
            // than relief.
            _DisplacementScale = 0.1
            _DisplacementOffset = -0.5

            // Only one texture set exists, so push the altitude blend bands out of
            // range and let "mid" cover everything (same trick Gilly's config uses).
            _LowMidBlendStart = -500
            _LowMidBlendEnd = -499
            _MidHighBlendStart = -498
            _MidHighBlendEnd = -497

            // Steep blending disabled - there is no dedicated steep texture.
            _SteepPower = 0.0001
            _SteepContrast = 1
            _SteepMidpoint = 0.001

            // Carbonaceous chondrite is about as non-reflective as rock gets, and the
            // first test build still came out looking glossy from the tracking station.
            // All three of these contribute to that and are now near zero:
            //   _SpecularIntensity  - direct highlight
            //   _EnvironmentMapFactor - literal environment reflection
            //   _FresnelPower       - rim brightening at grazing angles, which is most
            //                         of the visible disc when viewed from far away
            // Higher _FresnelPower means a tighter, weaker rim, so it goes UP, not down.
            // Deferred's screen-space reflections key off specular too, so keeping this
            // near zero matters more in a deferred pipeline than a forward one.
            _SpecularPower = 10
            _SpecularIntensity = 0.01
            _FresnelPower = 8
            _EnvironmentMapFactor = 0.03
            _RefractionIntensity = 0

            // ~22 m per texture repeat. Finer than Gilly's because the whole body is
            // only about 6 km around and the player is always close to the surface.
            _Tiling = 0.045

            // Hapke drives the lunar-style backscatter / opposition surge. Bennu's
            // rough, porous regolith shows a strong one, so this runs high.
            _Hapke = 0.6

            _BumpScale = 1.4
            _EmissionColor = 0,0,0,1
        }

        ParallaxScaledProperties
        {
            // Altitudes above the datum radius (949 m), matching the height map's
            // full 8-bit range. See PluginData/Bennu_Derived.cfg.
            minTerrainAltitude = 0
            maxTerrainAltitude = 219

            mode = FromTerrain

            Material
            {
                _ColorMap = Bennu/PluginData/Bennu_Color.dds
                _BumpMap = Bennu/PluginData/Bennu_Normal.dds
                _HeightMap = Bennu/PluginData/Bennu_Height.dds
                _PlanetBumpScale = 1.0

                // No atmosphere, no ocean, no emission.
                Keywords
                {
                }
            }

            TerrainMaterialOverride
            {
                // Scaled space covers the entire body in one draw, so the detail
                // tiling has to drop by orders of magnitude or it aliases into noise.
                _Tiling = 0.0013

                // Scaled space is where the glossy look was worst, because from far
                // away most of the visible disc is at a grazing angle where fresnel
                // and environment reflection dominate. Both off entirely here.
                _EnvironmentMapFactor = 0
                _SpecularIntensity = 0
                _FresnelPower = 10

                // Hapke backscatter is what gives an airless body its flat, dusty,
                // un-shaded look with no limb darkening - exactly what Bennu should
                // read as at a distance. Pushed higher in scaled space than on the
                // ground for that reason.
                _Hapke = 0.85
            }
        }
    }
}


// -------------------------------------------------------------------------------------
//  3. Kopernicus-side changes Parallax requires
// -------------------------------------------------------------------------------------
@Kopernicus:AFTER[ParallaxContinued]:NEEDS[ParallaxContinued,Parallax_StockTerrainTextures]
{
    @Body[Bennu]
    {
        // Parallax displaces the scaled-space mesh itself from _HeightMap, so it needs
        // the dense uniform sphere rather than the low-poly mesh Kopernicus bakes from
        // the PQS. This mirrors what ParallaxContinued does to every stock body in
        // Parallax_StockPlanetTextures/_Configs/ReplacePlanetMeshes.cfg.
        //
        // Worth noting because Bennu is unusually lumpy: its relief is 219 m on a 949 m
        // datum, about 23% of the radius, where a planet is nearer 1%. That is well
        // within what this path handles - Gilly spans 1494-6401 m of terrain on a
        // 13 km datum, roughly 29% relative relief, and uses exactly this mesh
        // replacement. The alternative (usingStockMesh = True, keeping the PQS-baked
        // mesh) is reserved in the stock configs for atmospheric bodies that have to
        // share geometry with Scatterer, which does not apply here.
        %Debug
        {
            %exportMesh = True
            %update = True
        }
        %cacheFile = ParallaxContinued/Models/ScaledMesh.bin

        %PQS
        {
            %Mods
            {
                // Near-field quad subdivision that feeds Parallax's tessellation and
                // scatter colliders. Level matches Gilly and Pol, the two smallest
                // stock bodies; the radius is pulled in because Bennu's entire
                // circumference is only about 6 km.
                Parallax
                {
                    subdivisionLevel = 5
                    subdivisionRadius = 200
                    order = 999999
                }
            }
        }
    }
}
