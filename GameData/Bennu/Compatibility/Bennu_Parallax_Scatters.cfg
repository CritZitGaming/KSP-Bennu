// =====================================================================================
//  Parallax Continued scatters for Bennu  --  the boulder field
// =====================================================================================
//
//  Bennu's defining surface characteristic is that it is buried in rubble. OSIRIS-REx
//  counted over 200 boulders larger than 10 m and expected a smooth pond to sample
//  from; it found essentially none.
//
//  DENSITY - READ THIS BEFORE CHANGING populationMultiplier
//  --------------------------------------------------------
//  The first test build was unrenderable: a single quad's worth of rock so dense the
//  game could barely draw one patch of it. The mistake was reasoning about density in
//  absolute terms instead of per quad.
//
//  Parallax scatter density is applied per PQS quad, and quad size scales with body
//  radius. Bennu's quads are about 11.6 m across at maxLevel 7; Gilly's are about 80 m.
//  That is roughly 47x less area per quad, so an identical populationMultiplier puts
//  47x more rock per square metre on Bennu than on Gilly. The first build then went
//  further and used multipliers 2x above Gilly's on top of that - call it 100x too
//  dense, which matches what it looked like.
//
//  Effective density is roughly populationMultiplier x spawnChance. Stock uses both
//  levers: Gilly runs 18 x 1.0, Pol runs 1 x 0.013. This config follows Pol - hold
//  populationMultiplier at 1 and tune spawnChance, which gives fine control without
//  going near the values that broke it.
//
//  Current settings land around 1.5x Gilly's per-area density: still visibly a rubble
//  pile, and renderable. IF IT IS STILL TOO DENSE, halve spawnChance - that is the one
//  number to turn, and it is safe to take it well below 0.1.
//
//  COLOUR
//  ------
//  The first build came out brown. Gilly's rock atlas averages RGB (93, 78, 69) - a
//  distinctly warm tan - and _Color multiplies it, so a neutral grey multiplier keeps
//  the brown and just darkens it. The multipliers below are the inverse of that bias
//  (ratios about 1 : 1.20 : 1.38), which lands the rock near a neutral (65, 65, 67)
//  to match Bennu's carbonaceous grey. Larger rocks run slightly brighter, as they do
//  on the real body - they are less space-weathered than the fines.
//
//  Rock models and the texture atlas are referenced from Parallax_StockScatterTextures
//  (Gilly's set - angular, airless-body rock). Referencing costs nothing and
//  redistributes nothing; the files must simply be installed.
//
//  collisionLevel notes: 0 = no collider, higher = more accurate and more expensive.
//  The larger rocks get real colliders so you can actually set down on them, or wedge
//  a lander between them, which is the authentic Bennu experience.
// =====================================================================================

ParallaxScatters:NEEDS[ParallaxContinued,Parallax_StockScatterTextures]
{
    Body
    {
        name = Bennu
        configVersion = 2

        // ---------------------------------------------------------------------------
        //  Gravel and small rubble - the ubiquitous background layer.
        // ---------------------------------------------------------------------------
        Scatter
        {
            name = BennuGravel
            model = Parallax_StockScatterTextures/Models/Gilly/smallvar1lod0
            collisionLevel = 1

            Optimizations
            {
                frustumCullingStartRange = 30
                frustumCullingScreenMargin = -40
                maxRenderableObjectsLOD0 = 400
                maxRenderableObjectsLOD1 = 1200
                maxRenderableObjectsLOD2 = 2000
            }
            SubdivisionSettings
            {
                subdivisionRangeMode = noSubdivision
            }
            DistributionNoise
            {
                noiseType = simplexPerlin
                inverted = False
                frequency = 320
                octaves = 6
                lacunarity = 2
                seed = 101955
            }
            Material
            {
                shader = Custom/ParallaxInstancedSolid
                _MainTex = Parallax_StockScatterTextures/Textures/Gilly/PluginData/rockatlas.dds
                _BumpMap = Parallax_StockScatterTextures/Textures/Gilly/PluginData/rockatlasnrm.dds
                _SpecularPower = 20
                _SpecularIntensity = 0
                _FresnelPower = 3
                _EnvironmentMapFactor = 0.4
                _BumpScale = 1
                _Hapke = 0.5
                _FresnelColor = 0.08,0.08,0.09,1
                // Inverse of the atlas's warm bias - see the colour note in the header.
                _Color = 0.70,0.84,0.96,1
                _CullMode = 2
                Keywords
                {
                }
            }
            Distribution
            {
                seed = 1
                spawnChance = 0.55
                range = 60
                populationMultiplier = 1
                minScale = 0.06,0.06,0.06
                maxScale = 0.16,0.16,0.16
                scaleRandomness = 0.6
                cutoffScale = 0.38
                steepPower = 0.4
                steepContrast = 2
                steepMidpoint = 0.7
                maxNormalDeviance = 1
                minAltitude = -100
                maxAltitude = 400
                altitudeFadeRange = 10
                alignToTerrainNormal = True
                coloredByTerrain = false
                LODs
                {
                    LOD
                    {
                        model = Parallax_StockScatterTextures/Models/Gilly/smallvar1lod1
                        range = 1.2
                        MaterialOverride
                        {
                        }
                    }
                    LOD
                    {
                        model = Parallax_StockScatterTextures/Models/Gilly/smallvar1lod2
                        range = 4.8
                        MaterialOverride
                        {
                        }
                    }
                }
            }
        }

