// =====================================================================================
//  SCANsat compatibility for Bennu
// =====================================================================================
//
//  SCANsat discovers celestial bodies automatically, so scanning works out of the box.
//
//  CORRECTION AFTER FLIGHT TESTING: an earlier version of this file claimed the
//  altimetry entry below was necessary to stop the map rendering as one flat colour.
//  That was wrong. The log shows SCANsat builds its "master terrain storage list" from
//  the savegame, not from SCANcolors.cfg, and generates a config at scene load for any
//  body missing from it - deriving the height range from the body itself:
//
//      [SCANsat] SCANsat terrain config [Bennu] cannot be found in master terrain
//                storage list
//      [SCANsat] Generating new SCANsat Terrain Config for [Bennu] - Max Height: [200m]
//
//  200 m against a real 219 m of relief, so SCANsat gets there on its own. That
//  "cannot be found" line is also not a Bennu problem - stock bodies including Laythe
//  log it identically on a fresh save.
//
//  The entry is kept because it costs nothing, sets the range exactly rather than
//  approximately, and picks a palette - Moho's mercury/6, built for a dark airless
//  rocky body - instead of the generic default. But it is a refinement, not a fix.
//  If you change it and see no effect in game, that is why: use SCANsat's own Colour
//  Management window, which edits the runtime config that actually wins.
//
//  ON `index`: SCANsat keys these by name, not index - the lookup is
//  SCANcontroller.getTerrainNode(string name), and setMasterTerrainNodes builds its
//  dictionary from the name field. The index is only used for ordering, so a high
//  value is used here to stay clear of the stock bodies' 0-16 and of whatever
//  flightGlobalsIndex Bennu ends up with alongside your other planet packs.
//
//  The !Item[Bennu] deletes first because SCANsat rewrites SCANcolors.cfg when you
//  change colours in its in-game UI. Without the delete, a saved entry plus this patch
//  would leave two Bennu nodes.
// =====================================================================================

@SCAN_Color_Config:NEEDS[SCANsat]:AFTER[SCANsat]
{
    @SCANsat_Altimetry
    {
        !Item[Bennu] {}

        Item
        {
            name = Bennu
            index = 311
            minHeightRange = 0
            maxHeightRange = 228
            clampHeight = Null
            maxHeightMultiplier = 1
            minHeightMultiplier = 1
            clampHeightMultiplier = 1
            paletteName = mercury
            paletteSize = 6
            paletteReverse = False
            paletteDiscrete = False
        }
    }

    // -------------------------------------------------------------------------------
    //  Resource map cutoffs.
    //
    //  These set where each resource's colour ramp starts and stops on Bennu. They are
    //  matched to the abundances in Bennu_Resources.cfg - a cutoff pair left at the
    //  stock 2.5 / 14 would saturate solid for Hydrates (which reaches 50 in
    //  Nightingale) and stay invisible for Uraninite (which peaks at 1.2).
    //
    //  Rule used: low cutoff just under the planetary minimum so ordinary ground still
    //  registers, high cutoff at the richest biome's maximum so the good sites stand
    //  out instead of clipping.
    // -------------------------------------------------------------------------------
    @SCANsat_Resources
    {
        @Item[Ore]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Ore
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 4
                    highResourceCutoff = 32
                }
            }
        }

        @Item[Water]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Water
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 5
                    highResourceCutoff = 45
                }
            }
        }

        @Item[Hydrates]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Hydrates
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 7
                    highResourceCutoff = 50
                }
            }
        }

        @Item[Substrate]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Substrate
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 2
                    highResourceCutoff = 40
                }
            }
        }

        @Item[Dirt]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Dirt
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 2
                    highResourceCutoff = 38
                }
            }
        }

        @Item[Minerals]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Minerals
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 4
                    highResourceCutoff = 30
                }
            }
        }

        @Item[MetallicOre]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = MetallicOre
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 3
                    highResourceCutoff = 30
                }
            }
        }

        @Item[Silicates]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Silicates
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 1.5
                    highResourceCutoff = 10
                }
            }
        }

        @Item[Gypsum]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Gypsum
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 1.5
                    highResourceCutoff = 9
                }
            }
        }

        @Item[RareMetals]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = RareMetals
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 0.4
                    highResourceCutoff = 9
                }
            }
        }

        @Item[ExoticMinerals]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = ExoticMinerals
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 0.25
                    highResourceCutoff = 2.5
                }
            }
        }

        @Item[Uraninite]:NEEDS[CommunityResourcePack]
        {
            @Resource_Planetary_Config
            {
                !Item:HAS[#bodyName[Bennu]] {}
                Item
                {
                    resourceName = Uraninite
                    bodyName = Bennu
                    index = 311
                    lowResourceCutoff = 0.08
                    highResourceCutoff = 1.2
                }
            }
        }
    }
}
