// =====================================================================================
//  KerbalFX compatibility for Bennu
// =====================================================================================
//
//  Two KerbalFX modules take per-body configuration: RoverDust (wheel dust) and
//  ImpactPuffs (engine plume puffs and touchdown bursts). AeroFX is atmospheric
//  reentry only and BlastFX is configured globally, so neither needs an entry.
//
//  WHY override_biome MATTERS HERE
//  ------------------------------
//  KerbalFX's Surface Colour Adaptation samples the body's biome map to tint dust.
//  That works when a biome map is painted in surface colours - but Bennu's is not.
//  Its biome colours are deliberately distinct marker values (Benben Saxum is bright
//  orange, Gargoyle Saxum is purple) so that Kopernicus can distinguish thirteen
//  biomes by exact colour match. Left to its own devices KerbalFX would throw up
//  bright orange dust next to Benben Saxum.
//
//  So `override_biome = true` on both modules, with an explicit colour taken from the
//  actual terrain albedo (about 61/255 in sRGB, the correct rendering of a 0.044
//  geometric albedo).
// =====================================================================================

KERBALFX_ROVER_DUST:NEEDS[KerbalFX]
{
    BODY_VISIBILITY
    {
        name = Bennu
        // Loose, unconsolidated regolith with essentially nothing holding it down -
        // wheels disturb it easily.
        multiplier = 1.15
    }

    BODY_TINT
    {
        name = Bennu
        // Near-black carbonaceous grey. Must override the biome map; see above.
        color = 0.24, 0.22, 0.21
        strength = 1.20
        override_biome = true
    }

    LIGHT_AWARE
    {
        name = Bennu
        // No atmosphere means no skylight. Anything out of direct sun goes black,
        // far more sharply than on a body with air to scatter light around.
        dark_scale = 0.10
        bright_scale = 1.00
        twilight_floor = 0.06
        min_perceived = 0.04
        color_tint = 0.55
    }
}

KERBALFX_IMPACT_PUFFS:NEEDS[KerbalFX]
{
    BODY_VISIBILITY
    {
        name = Bennu
        // Deliberately high. Bennu's surface turned out to be barely bound together -
        // OSIRIS-REx sank about half a metre into it during the touch-and-go sample
        // and threw up a debris cloud far larger than anyone predicted. Thrusters
        // near this surface should make a mess.
        multiplier = 1.40
    }

    BODY_TINT
    {
        name = Bennu
        color = 0.24, 0.22, 0.21
        strength = 1.30
        override_biome = true
    }

    LIGHT_AWARE
    {
        name = Bennu
        dark_scale = 0.10
        bright_scale = 1.00
        twilight_floor = 0.06
        min_perceived = 0.04
        color_tint = 0.55
    }
}
