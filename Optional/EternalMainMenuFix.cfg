// =====================================================================================
//  OPTIONAL - fixes the white body in the main menu. NOT part of the Bennu pack.
//
//  To use: copy this file anywhere inside GameData (e.g. GameData/EternalMainMenuFix.cfg)
//  To not use: leave it here; nothing outside GameData is ever loaded.
// =====================================================================================
//
//  THE DIAGNOSIS
//  -------------
//  The white sphere in the main menu is not Kerbin. It is Chiliad, from the Eternal
//  planet pack, rendering untextured.
//
//  Kopernicus picks the main menu body at random from those flagged randomMainMenuBody.
//  Eternal flags two:
//
//      Eternal/Configs/Chiliad/Chiliad.cfg:7    randomMainMenuBody = True
//      Eternal/Configs/Magna/Magna.cfg:7        randomMainMenuBody = True
//
//  Eternal's own textures are missing. GameData/Eternal/Texture/ is an empty directory,
//  and KSP.log shows the load failing on every one of them:
//
//      [OD] --> OnDemandStorage.EnableBody loading Chiliad
//      [OD] ERROR: Failed to load map Eternal/Texture/Detro_H.dds
//      [EXC] FileNotFoundException: Texture not present on disk or in configured asset
//            bundles
//            ...
//            Kopernicus.OnDemand.OnDemandStorage:EnableBody(String)
//            Kopernicus.RuntimeUtility.MainMenuFixer:Start()
//
//  With no colour texture the scaled-space material falls back to plain white, and the
//  atmosphere rim still renders - which is exactly what the main menu shows. The same
//  pack is also missing its Parallax textures for Chiliad and Magna:
//
//      [ERR] [Kopernicus] Failed to load texture Eternal/Texture/Parallax/Chiliad/...
//      [EXC] DirectoryNotFoundException: ...\Eternal\Texture\Parallax\Magna\Low_Albedo.dds
//
//  THE REAL FIX is to repair the Eternal install - it looks like a partial download, or
//  its textures ship as a separate package. This patch is the workaround: it stops
//  Eternal's two broken bodies being eligible for the main menu, so Kopernicus falls
//  back to Kerbin. It does not fix Eternal itself; those bodies will still be
//  untextured if you visit them.
//
//  Nothing here touches Bennu.
// =====================================================================================

@Kopernicus:AFTER[Eternal]:NEEDS[Eternal]
{
    @Body[Chiliad]
    {
        %randomMainMenuBody = False
    }
    @Body[Magna]
    {
        %randomMainMenuBody = False
    }
}
