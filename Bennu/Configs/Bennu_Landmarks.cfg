// =====================================================================================
//  Bennu landmarks  --  the Nightingale sample site
// =====================================================================================
//
//  Nightingale is where OSIRIS-REx actually touched Bennu on 20 October 2020. Up to now
//  it existed here only as a biome colour: a name on the map with nothing under it.
//  This makes it a place you can go to and, more usefully, a place you can land.
//
//  WHY A FLAT PAD IS WORTH THE EDIT
//  --------------------------------
//  Bennu's median slope is 9.7 deg and its 99th percentile is 38.8 deg, so most of the
//  body is landable but the tail is not, and at 0.049 m/s^2 a lander that touches down
//  on a slope slides rather than settles. A single prepared site gives the pack a
//  destination that rewards precision without flattening the character out of the rest
//  of the terrain. It also matches the mission: NASA spent two years surveying Bennu
//  precisely because almost none of it was safe to touch.
//
//  WHERE THE NUMBERS COME FROM
//  ---------------------------
//  Sampled out of the shipped height map (Bennu/PluginData/Bennu_Height.dds), not
//  guessed. The sampler cross-checks itself by reading Bennu_Biome.dds at the same
//  pixel and confirming the colour is Nightingale's 210,200,190 - if the lat/lon to
//  texel mapping or the row order were wrong, the colour would not match.
//
//      terrain within the flat disc  (r <=  30 m) : 78.2 .. 85.9 m above datum
//      terrain within the blend ring (r <= 110 m) : 64.4 .. 101.3 m
//      median over the disc                       : 80.7 m   <- flattenTo
//
//  So the pad cuts at most 5.2 m and fills at most 2.5 m. It reads as a bench in the
//  crater floor rather than a mesa or a pit.
//
//  UNITS - CHECKED, NOT ASSUMED
//  ----------------------------
//  PQSMod_FlattenArea.OnSetup computes  flattenToRadius = sphere.radius + flattenTo,
//  so flattenTo is metres ABOVE THE DATUM (949), not an absolute radius. It also does
//  angleInner = Atan(innerRadius / sphere.radius), so the two radii are metres of
//  surface distance. Both confirmed by disassembling the stock mod - getting either
//  wrong puts the pad kilometres off the surface or shrinks it to nothing.
//
//  FlattenArea rather than MapDecal: MapDecal needs a height-map texture to stamp, and
//  a flat disc does not need a texture. Plain FlattenArea rather than the Tangential
//  variant: tangential flattens to a plane, which on a 949 m body would sit 1.9 m proud
//  at the rim of a 60 m disc and read as tilted, because "level" for a lander means
//  perpendicular to local gravity - concentric with the sphere, not planar.
//
//  ONE KNOWN LIMITATION
//  --------------------
//  The stock mod has a removeScatter flag, but Kopernicus's FlattenArea loader does not
//  expose it, and Parallax scatters do not honour the stock allowScatter flag anyway.
//  So boulders can still spawn on the pad. They are collideable and visible on approach,
//  and the largest tier only spawns at 3% chance, so this is a nuisance rather than a
//  problem - but it does mean the pad is flat, not swept.
//
//  Delete this file if you would rather Bennu had no prepared surfaces anywhere.
// =====================================================================================

//  :LAST[Kopernicus] rather than :AFTER[Kopernicus] so this is guaranteed to run after
//  Configs/Bennu.cfg has created the body. Within a single pass ModuleManager orders by
//  file path, which would put Compatibility/ ahead of Configs/ - fine for the Parallax
//  patch, which sits in a later pass on purpose, but not something to rely on here.
@Kopernicus:LAST[Kopernicus]
{
    @Body[Bennu]
    {
        @PQS
        {
            @Mods
            {
                FlattenArea
                {
                    // 56 N, 42 E - the centre of the Nightingale biome.
                    // Altitude is ignored: FlattenArea normalises this vector and keeps
                    // only the direction (posNorm = position.normalized).
                    Position
                    {
                        latitude = 56.0
                        longitude = 42.0
                        altitude = 0
                    }

                    // Metres above datum. 949 + 80.7 = 1029.7 m surface radius.
                    flattenTo = 80.7

                    // 60 m of dead-flat disc, blended back into natural terrain over the
                    // next 80 m. The ring is deliberately wide: it has to absorb 20.6 m
                    // of relief on its high side, and a cubic Hermite blend peaks at
                    // about 1.5x its average slope, so 80 m puts the steepest part of
                    // the rim near 21 deg. A 45 m ring would have made it 35 deg, which
                    // is steeper than anything the pad is meant to save you from.
                    // Tools/Validate-Bennu.ps1 section 5c recomputes this from the
                    // shipped height map and fails past 30 deg.
                    innerRadius = 30
                    outerRadius = 110

                    // Tangents at the two ends of the blend, in metres of radius - NOT
                    // normalised weights. Zero at both ends means the pad leaves the flat
                    // disc level and rejoins the terrain level, with no kink at either
                    // seam.
                    smoothStart = 0
                    smoothEnd = 0

                    // After VertexHeightMap (10) and VertexSimplexHeight (30), or the
                    // noise would be laid back over the flattened area.
                    order = 40
                    enabled = true
                }
            }
        }
    }
}
