// =====================================================================================
//  101955 Bennu  --  a real celestial body for KSP, not a stock asteroid vessel
// =====================================================================================
//
//  Stock "asteroids" are Vessels: they are physics objects, they get pushed around by
//  anything that touches them, they despawn, and they cannot carry biomes, science
//  situations or a PQS terrain system. This is a proper CelestialBody, so it is fixed
//  on rails, it can be landed on, it has real terrain with colliders, biomes, science,
//  and it renders through Parallax / EVE / PlanetShine like any planet.
//
//  SCALE
//  -----
//  Real Bennu is 244.9 m mean radius with a surface gravity of 8e-5 m/s^2 - escape
//  velocity is about 20 cm/s, which means a Kerbal walking would leave the surface and
//  never come back. This build is scaled 4x (mean radius 979.6 m) and given Gilly-class
//  gravity so it is genuinely landable. The shape, rotation period, albedo, orbit and
//  surface nomenclature are all held to the real values.
//
//  All geometry numbers below are produced by Tools/Generate-BennuMaps.ps1 and mirrored
//  into PluginData/Bennu_Derived.cfg. If you regenerate the maps, copy them across.
// =====================================================================================

@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = Bennu
        identifier = CritZitGaming/Bennu
        cacheFile = Bennu/Cache/Bennu.bin

        // Gilly is the closest stock analogue: small, airless, rocky, vacuum-shaded.
        // Inheriting it gives sane PQS/ScaledVersion defaults and a decent-looking
        // fallback if Parallax is ever uninstalled. Every PQS mod is stripped because
        // the shape comes entirely from our own height map.
        Template
        {
            name = Gilly
            removeAllPQSMods = true
            removeBiomes = true
        }

        Properties
        {
            displayName = Bennu^N
            description = Formally 101955 Bennu, a carbonaceous rubble pile left over from the birth of the system. It is less a solid object than a loosely bound heap of gravel and boulders that never quite finished becoming a world. Its slow spin has dragged material toward the equator over hundreds of millions of years, leaving the distinctive ridge that gives it a silhouette like a spinning top. The surface reflects barely four percent of the light that reaches it, making it darker than charcoal and very difficult to see until you are close. Gravity here is a suggestion rather than a rule: kick off too hard and you will be waiting a long time to come back down.

            // ---- geometry (see Bennu_Derived.cfg) --------------------------------
            radius = 949

            // ---- gravity ---------------------------------------------------------
            // Real Bennu: geeASL 8.3e-6, escape velocity 0.20 m/s. That is authentic
            // but unlandable, so this is raised to Gilly's 0.005 g:
            //     surface gravity   0.049 m/s^2
            //     escape velocity   9.6 m/s
            //     orbital velocity  6.0 m/s at 1.2 km
            //     sphere of influence  about 65 km
            // Set this to 0.0000083 if you want the true, brutal version.
            geeASL = 0.005

            // ---- rotation --------------------------------------------------------
            // Real sidereal period: 4.296057 h = 15465.8 s. Kept exactly.
            // NOTE: real Bennu is a retrograde rotator (obliquity 177.6 deg). KSP has
            // no axial tilt for celestial bodies, so there is no correct way to express
            // that here and this spins prograde. A negative period is the usual
            // suggestion for reversing spin, but it is untested in this config and
            // touches enough of KSP's rotation handling to be worth treating as
            // experimental. Swap the two lines below if you want to experiment:
            rotationPeriod = 15465.8
            // rotationPeriod = -15465.8
            tidallyLocked = false
            initialRotation = 0
            rotates = true

            // ---- optical / thermal ----------------------------------------------
            // 0.044 is the real geometric albedo. The colour map is deliberately
            // brighter than true reflectance so the body is legible on screen; this
            // value is what actually drives solar panel output and thermals.
            albedo = 0.044
            emissivity = 0.956
            coreTemperatureOffset = 0

            // ---- small-body handling ---------------------------------------------
            // Stock timewarp thresholds assume bodies thousands of km across. Without
            // these you cannot warp anywhere near the surface. All are comfortably
            // inside the ~65 km SOI.
            timewarpAltitudeLimits = 0 300 800 1500 3000 8000 20000 40000

            // These are fractions of the body radius, so KSP's 0.015 / 0.005 defaults
            // put the navball's orbit/surface changeover at 14 m and 5 m above Bennu -
            // you would be practically touching down before it switched. Raised 10x to
            // give sensible absolute distances (142 m and 47 m) for a body where you
            // manoeuvre at single-digit m/s. Purely a UI threshold; tune to taste.
            navballSwitchRadiusMult = 0.15
            navballSwitchRadiusMultLow = 0.05

            // Make it targetable and visible in the tracking station / RnD.
            selectable = true
            RnDVisibility = Visible
            RnDRotation = true
            useTheInName = false

            // ---- map view / tracking station zoom limit --------------------------
            // maxZoom is the number of metres that fit across the screen at the closest
            // the camera will go. Kopernicus stores it as CelestialBody "maxZoom" and
            // its default is 10 * 6000 = 60,000 m - which is fine for a planet and
            // absurd here: Bennu is about 2.3 km across, so at the default it never
            // grows past 4% of the screen and the camera stops several km out.
            //
            // 2500 m frames the whole body with a little margin. The camera distance
            // that implies is 2500 / (2 * tan(fov/2)), roughly 2.2 km from the centre
            // against a maximum surface radius of 1168 m, so there is still most of a
            // body radius of clearance and no risk of the camera ending up inside the
            // terrain. Lower it further if you want to get closer; below about 1400 it
            // will start to clip.
            maxZoom = 2500

            biomeMap = Bennu/PluginData/Bennu_Biome.dds

            ScienceValues
            {
                landedDataValue = 9
                inSpaceLowDataValue = 8
                inSpaceHighDataValue = 7
                recoveryValue = 8
                // Body is ~1 km across, so "low space" needs to be a low number.
                spaceAltitudeThreshold = 5000
                flyingAltitudeThreshold = 1000
            }

            // Biome colours must match PluginData/Bennu_Biome.dds byte-for-byte.
            // The map is written uncompressed precisely so these stay exact.
            Biomes
            {
                Biome
                {
                    name = Equatorial Ridge
                    displayName = Equatorial Ridge
                    value = 1.3
                    color = 0.352941,0.313725,0.294118,1
                }
                Biome
                {
                    name = Northern Hemisphere
                    displayName = Northern Hemisphere
                    value = 1.0
                    color = 0.274510,0.282353,0.321569,1
                }
                Biome
                {
                    name = Southern Hemisphere
                    displayName = Southern Hemisphere
                    value = 1.0
                    color = 0.321569,0.274510,0.258824,1
                }
                Biome
                {
                    name = North Polar Region
                    displayName = North Polar Region
                    value = 1.2
                    color = 0.156863,0.172549,0.203922,1
                }
                Biome
                {
                    name = South Polar Region
                    displayName = South Polar Region
                    value = 1.2
                    color = 0.203922,0.164706,0.156863,1
                }
                Biome
                {
                    name = Nightingale Crater
                    displayName = Nightingale Crater
                    value = 1.8
                    color = 0.823529,0.784314,0.745098,1
                }
                Biome
                {
                    name = Osprey Crater
                    displayName = Osprey Crater
                    value = 1.6
                    color = 0.705882,0.674510,0.658824,1
                }
                Biome
                {
                    name = Kingfisher Crater
                    displayName = Kingfisher Crater
                    value = 1.6
                    color = 0.588235,0.572549,0.588235,1
                }
                Biome
                {
                    name = Sandpiper Crater
                    displayName = Sandpiper Crater
                    value = 1.6
                    color = 0.470588,0.462745,0.494118,1
                }
                Biome
                {
                    name = Benben Saxum
                    displayName = Benben Saxum
                    value = 1.9
                    color = 0.921569,0.470588,0.235294,1
                }
                Biome
                {
                    name = Roc Saxum
                    displayName = Roc Saxum
                    value = 1.9
                    color = 0.862745,0.313725,0.274510,1
                }
                Biome
                {
                    name = Tlanuwa Regio
                    displayName = Tlanuwa Regio
                    value = 1.5
                    color = 0.627451,0.372549,0.431373,1
                }
                Biome
                {
                    name = Gargoyle Saxum
                    displayName = Gargoyle Saxum
                    value = 1.9
                    color = 0.745098,0.549020,0.784314,1
                }
            }
        }

        // ---------------------------------------------------------------------------
        //  Orbit: real Bennu's elements, with Kerbin's semi-major axis standing in for
        //  1 AU. Bennu is an Apollo-group NEO that crosses Earth's orbit, and this
        //  reproduces that relationship exactly - periapsis falls inside Kerbin's orbit
        //  and apoapsis outside it.
        //
        //      a  = 1.126391 AU  ->  1.126391 x 13,599,840,256 m
        //      Pe = 12,197,205,000 m   (Kerbin is at 13,599,840,256 m)
        //      Ap = 18,440,270,000 m
        //      period ~ 1.196 Kerbin years
        // ---------------------------------------------------------------------------
        Orbit
        {
            referenceBody = Sun
            semiMajorAxis = 15318737666
            eccentricity = 0.2037451
            inclination = 6.03494
            longitudeOfAscendingNode = 2.06086
            argumentOfPeriapsis = 66.22306
            meanAnomalyAtEpochD = 101.703
            epoch = 0
            color = 0.42,0.36,0.33,1

            // ---- map node icon ---------------------------------------------------
            // Kopernicus turns this whole texture into a sprite with a centred pivot
            // and hands it to body.MapObject.uiNode.SetIcon, so there is no atlas or
            // cell layout to match - any square RGBA texture works.
            //
            // Deliberately NOT in PluginData: Texture2DParser tries
            // GameDatabase.ExistsTexture first and only falls back to loading off disk,
            // and KSP skips PluginData when building the GameDatabase. A normal folder
            // keeps this on the path that is guaranteed to resolve. It is 16 KB.
            //
            // Generated by Tools/Generate-BennuIcon.ps1 - a flat-poled diamond with the
            // equatorial crest, drawn to the same shape law as the body but with its
            // proportions pushed so it still reads at the ~20 px KSP draws it at.
            iconTexture = Bennu/Icons/Bennu_Icon

            // Tinted to the same dusty brown as the orbit line above, slightly lifted
            // so it stays legible against the black of the tracking station.
            iconColor = 0.55,0.47,0.42,1
        }

        // ---------------------------------------------------------------------------
        //  Scaled space. Parallax replaces this material when it is installed (see
        //  Bennu_Parallax.cfg); these values are what you get without it.
        // ---------------------------------------------------------------------------
        ScaledVersion
        {
            type = Vacuum
            fadeStart = 0
            fadeEnd = 0

            Material
            {
                texture = Bennu/PluginData/Bennu_Color.dds
                normals = Bennu/PluginData/Bennu_Normal.dds
                color = 1,1,1,1
                specColor = 0.03,0.03,0.03,1
                shininess = 0.02
            }
        }

        // ---------------------------------------------------------------------------
        //  PQS. Ranges are scaled for a body ~1 km across; stock values assume
        //  something thousands of times larger and would leave terrain switched off.
        // ---------------------------------------------------------------------------
        PQS
        {
            minLevel = 2
            maxLevel = 7
            minDetailDistance = 4
            deactivateAltitude = 30000
            fadeStart = 20000
            fadeEnd = 28000
            mapMaxHeight = 219

            // At 0.049 m/s^2 there is almost no weight pressing a lander onto the
            // surface, so the default terrain material lets craft skid and bounce
            // indefinitely. High friction and zero bounce make touchdowns stick.
            PhysicsMaterial
            {
                bounceCombine = Minimum
                frictionCombine = Maximum
                bounciness = 0
                staticFriction = 1.2
                dynamicFriction = 1.0
            }

            Mods
            {
                // The shape model. deformity MUST equal (max radius - datum) from
                // Bennu_Derived.cfg or scaled space and terrain will disagree.
                VertexHeightMap
                {
                    map = Bennu/PluginData/Bennu_Height.dds
                    offset = 0
                    deformity = 219
                    scaleDeformityByRadius = false
                    order = 10
                    enabled = true
                }

                // Terrain vertex colour. Parallax uses this to tint its own shading.
                VertexColorMap
                {
                    map = Bennu/PluginData/Bennu_Color.dds
                    order = 20
                    enabled = true
                }

                // Sub-texel relief, to break up height-map texel edges and dither the
                // 8-bit quantisation steps out of gentle slopes.
                //
                // THIS WAS THE MAIN CAUSE OF THE UNLANDABLE TERRAIN in the first test
                // build, where it ran deformity 5 / frequency 250 / 5 octaves. On a
                // 946 m body, frequency 250 is a wavelength of about 7.6 m, so 5 m of
                // amplitude meant a ~65% slope - and the fifth octave put half a metre
                // of relief at half-metre wavelength, which is a vertical face. Slope
                // is amplitude over wavelength; on a body this small it is very easy
                // to write a number that reads harmless and is actually a cliff.
                //
                // Now 1 m at ~31 m wavelength, roughly a 3% slope. MapSO already
                // bilinearly interpolates the height map, so the quantisation shows up
                // as gentle faceting rather than steps and needs very little dither.
                VertexSimplexHeight
                {
                    seed = 101955
                    deformity = 1.0
                    octaves = 3
                    persistence = 0.5
                    frequency = 60
                    order = 30
                    enabled = true
                }
            }
        }
    }
}
