// =====================================================================================
//  Bennu contracts  --  an OSIRIS-REx arc for Contract Configurator
// =====================================================================================
//
//  Bennu is a place with no reason to go. Nothing in the stock contract system will ever
//  point a player at it, and "there is an asteroid out there" is not a mission. These
//  three contracts retrace what OSIRIS-REx actually did: arrive and survey, touch the
//  surface at Nightingale, bring the sample home.
//
//  Everything here is gated on ContractConfigurator. Without it the file does nothing;
//  Bennu itself is unaffected.
//
//  KEYS ARE VERIFIED, NOT REMEMBERED
//  ---------------------------------
//  Contract Configurator has no parser attributes - every factory reads its keys as
//  string literals inside Load(). The keys used below were pulled out of the IL of the
//  installed ContractConfigurator.dll (2.12.2), so they match this version rather than
//  whatever the wiki last described. Requirement and parameter type names come from
//  enumerating the ContractRequirement and ParameterFactory subclasses in the same
//  assembly.
//
//  WHAT THE PLAYER IS ACTUALLY UP AGAINST
//  --------------------------------------
//  Orbital velocity just above the surface is 6.07 m/s and escape velocity is 9.65 m/s,
//  so "orbit" here means station-keeping at walking pace inside a 65 km SOI. The transfer
//  is the hard part: Bennu's orbit is eccentric (0.204) and inclined 6 deg to Kerbin's,
//  with a 1.195 Kerbin-year period, so windows are infrequent and plane change is not
//  optional.
//
//  NO DEADLINES
//  ------------
//  deadline = 0 throughout. A transfer window this rare plus a 1.2-year period means any
//  deadline generous enough to be fair is long enough to be meaningless, and a deadline
//  tight enough to matter would fail players for orbital mechanics they do not control.
//
//  Rewards are tuned against stock outer-planet contracts. They are the first thing to
//  change if they do not suit your economy - none of the rest of the pack depends on them.
// =====================================================================================

CONTRACT_GROUP:NEEDS[ContractConfigurator]
{
    name = Bennu
    displayName = 101955 Bennu
    minVersion = 2.0.0

    // One Bennu mission at a time. The chain is sequential anyway, and offering all
    // three at once would spoil the arc.
    maxSimultaneous = 1
}


// -------------------------------------------------------------------------------------
//  1. Reconnaissance - get there and hold station
// -------------------------------------------------------------------------------------
CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
    name = BennuReconnaissance
    group = Bennu
    title = Reconnaissance of 101955 Bennu
    genericTitle = Reconnaissance of 101955 Bennu

    description = A carbonaceous near-Earth object crosses Kerbin's orbit twice every 1.2 years, and nobody has looked at it properly. Bennu is 1.9 km across, black as charcoal, and old enough to predate every planet you have ever landed on. We want a spacecraft in orbit around it, and we want it to stay there long enough to be called an orbit rather than a flyby.
    genericDescription = Survey a near-Earth object from orbit.

    synopsis = Put a spacecraft into orbit around Bennu and hold it there for six hours.
    completedMessage = Six hours at six metres per second. The survey data is already changing what we thought this thing was made of.

    notes = Orbital velocity just above Bennu's surface is about 6 m/s and escape velocity is 9.65 m/s. RCS will do most of the work; the main engine will throw you out of the system.

    targetBody = Bennu

    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0
    prestige = Significant

    advanceFunds = 60000
    rewardFunds = 180000
    rewardScience = 60
    rewardReputation = 25
    failureFunds = 30000
    failureReputation = 20

    // Escaping Kerbin's SOI is the honest gate here - this is an interplanetary
    // mission, and offering it to a programme that has only reached the Mun is noise.
    REQUIREMENT
    {
        name = EscapeKerbin
        type = Escape
        targetBody = Kerbin
    }

    PARAMETER
    {
        name = HoldOrbit
        type = VesselParameterGroup
        title = Orbit Bennu for six hours
        duration = 6h

        PARAMETER
        {
            name = InOrbit
            type = Orbit
            situation = ORBITING

            // Above the 219 m of relief, and well inside the 65.4 km SOI.
            minAltitude = 300
            maxAltitude = 20000
        }
    }

    PARAMETER
    {
        name = SurveyScience
        type = CollectScience
        title = Return or transmit science from Bennu orbit
        location = Space
        recoveryMethod = RecoverOrTransmit
        rewardScience = 15
    }
}


// -------------------------------------------------------------------------------------
//  2. Touch-and-go at Nightingale
// -------------------------------------------------------------------------------------
CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
    name = BennuTouchAndGo
    group = Bennu
    title = Touch-and-Go at Nightingale Crater
    genericTitle = Sample a near-Earth object

    description = The survey found one site worth touching. Nightingale, at 56 north, is the flattest ground on a body that is otherwise boulders all the way down - which is exactly the judgement OSIRIS-REx made about the real crater before it went in. Get a craft onto that ground and get science off it. What you do afterwards is a separate contract; we would prefer you did not stay.
    genericDescription = Land at a specific site on a near-Earth object and collect science there.

    synopsis = Land inside Nightingale Crater and collect science from the surface.
    completedMessage = Contact, and the regolith went everywhere. Nightingale is officially the second place anyone has set down on a near-Earth object.

    notes = Nightingale is the one prepared landing site on Bennu - a 60 m flat disc at 56 N 42 E. Everything outside it is natural terrain, and the 99th-percentile slope on this body is 38 degrees. A navigation waypoint is placed on the site when you accept.

    targetBody = Bennu

    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0
    prestige = Exceptional

    advanceFunds = 90000
    rewardFunds = 260000
    rewardScience = 90
    rewardReputation = 35
    failureFunds = 45000
    failureReputation = 25

    REQUIREMENT
    {
        name = SurveyFirst
        type = CompleteContract
        contractType = BennuReconnaissance
    }

    // Navball and map marker on the site itself. Landing at 0.049 m/s^2 gives you a very
    // long time to correct, but only if you know where you are aiming.
    BEHAVIOUR
    {
        name = NightingaleWaypoint
        type = WaypointGenerator

        WAYPOINT
        {
            name = Nightingale
            icon = sample
            latitude = 56.0
            longitude = 42.0
            altitude = 0
        }
    }

    PARAMETER
    {
        name = TouchDown
        type = VesselParameterGroup
        title = Land inside Nightingale Crater

        PARAMETER
        {
            name = LandedAtSite
            type = ReachState
            situation = LANDED
            biome = Nightingale Crater
        }

        PARAMETER
        {
            name = SampleTheSite
            type = CollectScience
            title = Collect science on the surface at Nightingale
            situation = SrfLanded
            biome = Nightingale Crater

            // None - the experiment only has to be run. Getting it home is contract 3,
            // which is the whole point of the arc.
            recoveryMethod = None
        }
    }
}


// -------------------------------------------------------------------------------------
//  3. Sample return
// -------------------------------------------------------------------------------------
CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
    name = BennuSampleReturn
    group = Bennu
    title = Return the Bennu Sample
    genericTitle = Return a sample from a near-Earth object

    description = Everything so far has been telemetry. What the geologists want is the material itself - unweathered carbonaceous rock that has been sitting in the dark since before Kerbin finished forming, in a sealed container, on a bench, at home. Bring back science collected on Bennu's surface and recover it on Kerbin. Transmitting it does not count and never did.
    genericDescription = Recover surface science from a near-Earth object on Kerbin.

    synopsis = Recover science collected on Bennu's surface back on Kerbin.
    completedMessage = The capsule is down and the container held. Four and a half billion years in transit, and the last two metres were the ones we worried about.

    notes = The science must be physically recovered on Kerbin. Transmitted data will not complete this contract.

    targetBody = Bennu

    maxCompletions = 1
    maxSimultaneous = 1
    deadline = 0
    prestige = Exceptional

    advanceFunds = 40000
    rewardFunds = 400000
    rewardScience = 150
    rewardReputation = 60
    failureFunds = 20000
    failureReputation = 30

    REQUIREMENT
    {
        name = TouchFirst
        type = CompleteContract
        contractType = BennuTouchAndGo
    }

    PARAMETER
    {
        name = BringItHome
        type = CollectScience
        title = Recover science collected on Bennu's surface
        location = Surface
        recoveryMethod = Recover
    }
}
