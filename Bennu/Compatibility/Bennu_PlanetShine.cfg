// =====================================================================================
//  PlanetShine compatibility for Bennu
// =====================================================================================
//
//  PlanetShine bounces light from a body onto craft near it. Without an entry here it
//  falls back to a generic default, which for Bennu would be far too bright - this is
//  one of the darkest objects in the solar system.
//
//  intensity is set from real albedo rather than picked by eye:
//      Mun    geometric albedo 0.12  -> PlanetShine intensity 1.0
//      Bennu  geometric albedo 0.044 -> 0.044 / 0.12 = 0.37
//
//  So a lander in Bennu's shadow gets almost no fill light, which is exactly right:
//  OSIRIS-REx imagery of the night side is essentially black.
//
//  colour is the same near-neutral dark carbonaceous grey used by the terrain colour
//  map, warmed very slightly - Bennu's spectrum is subtly red-sloped.
// =====================================================================================

PlanetshineCelestialBody:NEEDS[PlanetShine]
{
    name = Bennu
    color = 92,86,80
    intensity = 0.37
    atmosphereAmbient = 0.2
    groundAmbientOverride = 1
}
