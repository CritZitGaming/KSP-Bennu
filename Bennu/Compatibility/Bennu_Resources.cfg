// =====================================================================================
//  Resource distribution for Bennu  --  stock Ore + Community Resource Pack
// =====================================================================================
//
//  Without this Bennu inherits only the stock GLOBAL_RESOURCE for Ore and nothing else,
//  so SCANsat's resource maps would come back empty for every CRP resource. These
//  definitions give it a distinct and scientifically grounded character.
//
//  THE SHORT VERSION: Bennu is a water mine, not a metal mine.
//
//  That is not a gameplay invention, it is why the body was chosen as a mission target
//  in the first place. Bennu is a B-type carbonaceous asteroid, and the sample returned
//  in September 2023 came back dominated by hydrated phyllosilicates - clay minerals
//  with water chemically locked into them - alongside magnetite, iron sulfides,
//  carbonates, phosphates, and roughly 8.5% carbon by weight, the highest of any
//  returned sample. What it is NOT is a differentiated body: nothing here ever melted
//  and sorted itself into an ore deposit, so the heavy and exotic metals that
//  concentrate through geological processing are largely absent.
//
//  So: Water, Hydrates, Substrate and Dirt run high; MetallicOre and Minerals are
//  respectable; Uraninite is nearly absent. As a destination Bennu is a refuelling
//  stop, not a mining colony.
//
//  Numbers are percentage abundances, 0.0 - 100.0.
//  ResourceType:  0 = crustal   1 = oceanic   2 = atmospheric   3 = interplanetary
//                 Everything here is crustal - Bennu has no atmosphere and no ocean.
//
//  BIOME_RESOURCE entries override PLANETARY_RESOURCE within a named biome. BiomeName
//  must match Properties/Biomes in Bennu.cfg exactly; Validate-Bennu.ps1 checks this.
// =====================================================================================


// =====================================================================================
//  Ore (stock)
// =====================================================================================
PLANETARY_RESOURCE
{
    ResourceName = Ore
    ResourceType = 0
    PlanetName = Bennu

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 4
        MaxAbundance = 18
        Variance = 50
        Dispersal = 3
    }
}

